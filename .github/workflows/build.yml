name: Build APKs

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble module + companion APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew :module:assembleDebug :companion:assembleDebug --stacktrace

      - name: Build unsigned release APKs
        run: ./gradlew :module:assembleRelease :companion:assembleRelease --stacktrace

      - name: Upload module APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassXposed-module
          path: module/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload companion APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassXposed-companion
          path: companion/build/outputs/apk/**/*.apk
          if-no-files-found: error
